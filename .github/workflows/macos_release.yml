name: macos_release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create (for example flutter-0.1.0)
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # The default release profile (thin LTO, one codegen unit, debug info) needs more memory
  # than a hosted macOS runner has, so build lighter.
  CARGO_PROFILE_RELEASE_LTO: "off"
  CARGO_PROFILE_RELEASE_DEBUG: "0"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
  CARGO_BUILD_JOBS: "3"

jobs:
  build:
    name: Build macOS (Apple silicon)
    runs-on: macos-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          brew install cmake || true
          xcodebuild -downloadComponent MetalToolchain || true

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release -p zed
        env:
          ZED_COMMIT_SHA: ${{ github.sha }}

      - name: Package
        run: |
          mkdir -p dist
          cp target/release/zed dist/zed
          cd dist
          zip -9 zed-flutter-macos-arm64.zip zed
          shasum -a 256 zed-flutter-macos-arm64.zip > zed-flutter-macos-arm64.zip.sha256

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release create "$TAG" \
            dist/zed-flutter-macos-arm64.zip \
            dist/zed-flutter-macos-arm64.zip.sha256 \
            --target "$GITHUB_SHA" \
            --title "Zed for Flutter $TAG" \
            --prerelease \
            --notes "Unsigned macOS (Apple silicon) build of Zed with Flutter tooling and Clyde.

          After downloading, unpack it and clear the quarantine flag once:

              unzip zed-flutter-macos-arm64.zip
              xattr -d com.apple.quarantine zed
              ./zed

          Built from commit $GITHUB_SHA."
